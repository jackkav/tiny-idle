<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <title>Smallest Thing</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230b0d12'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23ffd479'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Smallest Thing</h1>
    <button id="gear" class="icon" type="button" aria-label="Settings" aria-haspopup="dialog" title="Settings">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
        <circle cx="12" cy="12" r="7" fill="none" stroke="currentColor" stroke-width="3" stroke-dasharray="2.75 2.75"/>
        <circle cx="12" cy="12" r="5.5" fill="none" stroke="currentColor" stroke-width="2"/>
      </svg>
    </button>
  </header>

  <main>
    <section id="readout" aria-live="off">
      <div id="dust" class="big">0</div>
      <div class="unit">kg of dust</div>
      <div id="rate" class="muted"></div>
      <div id="scale" class="muted"></div>
      <div id="bar" aria-hidden="true"><div id="fill"></div></div>
      <div id="bar-labels" class="muted" aria-hidden="true"><span>1e-101 kg</span><span>the universe</span></div>
    </section>

    <section id="tapzone">
      <button id="tap" type="button" aria-label="Collect dust"><span id="speck"></span></button>
      <div id="floaters" aria-hidden="true"></div>
    </section>

    <p id="hint" class="hint" aria-live="polite" hidden></p>

    <div id="features"></div>

    <section id="condense">
      <h2>Condensation</h2>
      <div id="condense-body"></div>
    </section>

    <section>
      <h2>Collectors</h2>
      <div id="gens" class="list"></div>
    </section>

    <section id="sec-ups">
      <h2>Methods</h2>
      <div id="ups" class="list"></div>
    </section>
  </main>

  <dialog id="settings" aria-labelledby="settings-title">
    <div class="dlg-body">
      <h2 id="settings-title">Settings</h2>

      <div class="field">
        <label for="set-notation">Number style</label>
        <select id="set-notation">
          <option value="sci">Scientific</option>
          <option value="eng">Engineering</option>
          <option value="words">Words</option>
        </select>
        <div id="set-notation-example" class="muted"></div>
      </div>

      <div class="field check">
        <input id="set-sound" type="checkbox">
        <label for="set-sound">Sound</label>
        <div id="set-sound-note" class="muted" hidden>Sound is off because the address has mute=1.</div>
      </div>
      <div class="field check">
        <input id="set-motion" type="checkbox">
        <label for="set-motion">Reduce motion</label>
      </div>
      <div class="field check">
        <input id="set-hints" type="checkbox">
        <label for="set-hints">Show hints</label>
      </div>

      <div class="field">
        <label for="save-text">Save string</label>
        <textarea id="save-text" rows="4" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="Export makes a string. Paste a string here to import."></textarea>
        <div class="row">
          <button id="save-export" class="plain" type="button">Export save</button>
          <button id="save-import" class="plain" type="button">Import save</button>
        </div>
        <div id="save-msg" class="muted" role="status"></div>
      </div>

      <div class="row end">
        <button id="reset" class="plain danger" type="button">Reset game</button>
        <button id="settings-close" class="plain" type="button">Close</button>
      </div>
    </div>
  </dialog>

  <div id="toasts" role="status"></div>
  <script type="module" src="ui.js"></script>
</body>
</html>
